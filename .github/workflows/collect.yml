name: 회의 수집·요약 파이프라인

on:
  schedule:
    # 국무회의는 통상 화요일 오전(KST) 개최 → 화요일 오후 KST(= 04~10시 UTC) 집중 폴링
    - cron: "0 4 * * 2"
    - cron: "0 7 * * 2"
    - cron: "0 10 * * 2"
    # 그 외 요일은 하루 1회 (21:00 UTC = 오전 6시 KST)
    - cron: "0 21 * * *"
  # 수동 킥: .github/collect-now 파일을 커밋하면 즉시 수집 실행.
  # (dispatch 권한이 없는 환경에서 git push만으로 파이프라인을 돌리기 위한 스위치.
  #  봇의 data 커밋은 이 경로를 건드리지 않으므로 재실행 루프가 생기지 않는다.)
  push:
    branches: [main]
    paths:
      - ".github/collect-now"
  workflow_dispatch:
    inputs:
      since:
        description: "이 날짜(YYYY-MM-DD) 이후 영상만 수집"
        required: false
      reconcile:
        description: "출처 대조·교체: 클립/삭제된 출처를 정상 공식 본편으로 바꿈(기존 회의 유지)"
        type: boolean
        default: false
      max:
        description: "이번 실행에서 요약할 최대 회의 수(기본 3 — 밀린 백로그를 한 번에 처리하려면 크게)"
        required: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 파이프라인 실행
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # 유튜브 봇 차단(LOGIN_REQUIRED) 우회용 로그인 쿠키(선택, 등록 시 자막 수집 안정화)
          YT_COOKIE: ${{ secrets.YT_COOKIE }}
          # 주거용 프록시(선택). 등록 시 유튜브 요청을 가정용 IP로 우회 → 데이터센터
          # IP 차단을 근본 회피(쿠키 만료·재차단 문제 해소). 예: http://user:pass@host:port
          PROXY_URL: ${{ secrets.PROXY_URL }}
          # LLM 공급자: 아래 셋 중 쓰는 것 하나만 Secrets에 등록하면 됨
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 공급자·모델 선택(선택): 리포 Settings → Secrets and variables → Actions → Variables 탭
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL_MAIN: ${{ vars.LLM_MODEL_MAIN }}
          LLM_MODEL_LIGHT: ${{ vars.LLM_MODEL_LIGHT }}
          # Cloudflare R2 아카이브(선택): 등록 시 자막·요약 JSON을 R2에 미러링
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          SINCE: ${{ inputs.since }}
          # 수동 킥(push)으로 돌릴 땐 밀린 백로그를 한 번에 처리하도록 넉넉히,
          # dispatch는 입력값, 그 외(cron)는 코드 기본값(3).
          MAX_MEETINGS: ${{ inputs.max || (github.event_name == 'push' && '20' || '') }}
        run: npm run pipeline

      - name: 출처 대조·교체 (수동 트리거 시)
        if: ${{ inputs.reconcile }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RECONCILE: "1"
        run: npm run reconcile

      - name: 결과 커밋
        run: |
          git config user.name "opencabinet-bot"
          git config user.email "actions@github.com"
          # 자막(transcripts)도 커밋해 쌓아둔다 — 한 번 받으면 재수집 불필요,
          # 쿠키가 죽어도 이미 받은 자막으로 요약을 이어갈 수 있다.
          git add data/meetings data/speakers.json data/transcripts
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 회의 자막·요약 자동 수집 ($(date -u +%Y-%m-%d))"
            git push
          fi
